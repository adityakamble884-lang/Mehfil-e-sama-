<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0d18" />
      <stop offset="100%" stop-color="#080204" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae498" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#997c1d" />
    </linearGradient>
    <radialGradient id="flameGrad" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffd000" />
      <stop offset="70%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)" />
  <rect width="184" height="184" x="4" y="4" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" />

  <!-- Mughal Arch Silhouette -->
  <path d="M 40 156 L 40 96 C 40 56, 70 34, 96 22 C 122 34, 152 56, 152 96 L 152 156 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Diya Lamp Base -->
  <path d="M 72 136 Q 96 156 120 136 Z" fill="url(#goldGrad)" />
  <line x1="68" y1="136" x2="124" y2="136" stroke="#fae498" stroke-width="2.5" stroke-linecap="round" />

  <!-- Diya Flame -->
  <path d="M 96 88 C 88 108, 86 122, 96 134 C 106 122, 104 108, 96 88 Z" 
        fill="url(#flameGrad)" filter="url(#glow)" />

  <!-- Subtle Urdu Calligraphy Dot/Noqta / Star Accent -->
  <polygon points="96,44 98,50 104,52 98,54 96,60 94,54 88,52 94,50" fill="#fae498" opacity="0.85" />
</svg>
