<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad512" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2f0e1c" />
      <stop offset="60%" stop-color="#14060b" />
      <stop offset="100%" stop-color="#070204" />
    </radialGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae498" />
      <stop offset="45%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#997c1d" />
    </linearGradient>
    <radialGradient id="flameGrad512" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffd000" />
      <stop offset="70%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <radialGradient id="aura512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 179, 71, 0.4)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <filter id="glow512" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad512)" />
  <rect width="496" height="496" x="8" y="8" rx="96" fill="none" stroke="url(#goldGrad512)" stroke-width="4" opacity="0.65" />

  <!-- Outer Jaali Lattice Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad512)" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.3" />

  <!-- Mughal Arch Structure -->
  <path d="M 116 410 L 116 260 C 116 160, 190 95, 256 60 C 322 95, 396 160, 396 260 L 396 410 Z" 
        fill="rgba(32, 13, 22, 0.4)" stroke="url(#goldGrad512)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cusped Arch Inner Detail -->
  <path d="M 146 410 L 146 270 Q 146 220 186 185 Q 220 155 256 120 Q 292 155 326 185 Q 366 220 366 270 L 366 410"
        fill="none" stroke="url(#goldGrad512)" stroke-width="2.5" opacity="0.5" />

  <!-- Diya Warm Halo -->
  <circle cx="256" cy="275" r="110" fill="url(#aura512)" />

  <!-- Diya Lamp Base -->
  <path d="M 190 350 Q 256 405 322 350 Z" fill="url(#goldGrad512)" />
  <line x1="180" y1="350" x2="332" y2="350" stroke="#fae498" stroke-width="6" stroke-linecap="round" />

  <!-- Diya Flame -->
  <path d="M 256 220 C 232 270, 226 312, 256 345 C 286 312, 280 270, 256 220 Z" 
        fill="url(#flameGrad512)" filter="url(#glow512)" />

  <!-- Upper Calligraphy Star / Sparkle Motif -->
  <polygon points="256,120 262,136 278,142 262,148 256,164 250,148 234,142 250,136" fill="#fae498" opacity="0.9" />
</svg>
